# XcodeGen spec for a minimal app that validates the FanControlHelper embedding recipe
# (docs/integration.md §1–§4, docs/helper.md §1–§2). See README.md.
#
# Identifiers (docs/helper.md "Configuring identifiers"): the three FANCONTROL_* settings below are
# the only place to change them. Helper-Info.plist (embedded into the helper) is the runtime source;
# the app's Run Script copies its FanControl* keys into the app's Info.plist and generates the
# LaunchDaemon plist (Support/embed-helper-config.sh). A host with other identifiers, e.g.
#   xcodebuild ... FANCONTROL_APP_ID=com.acme.Notch FANCONTROL_HELPER_ID=com.acme.Notch.helper \
#                  FANCONTROL_HELPER_INFO_PLIST=/path/to/acme-Helper-Info.plist
# needs no Swift changes (the Helper-Info.plist must name the same identifiers; the build fails otherwise).
#
# Signing: ad-hoc by default. Once a Team ID exists, build with
#   xcodebuild ... DEVELOPMENT_TEAM=<TeamID> CODE_SIGN_IDENTITY="Apple Development"   (or "Developer ID Application")
# or set DEVELOPMENT_TEAM under settings.base below.
name: FanControlSmoke
options:
  bundleIdPrefix: com.example.dynamicnotch
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  FanControl:
    path: ../..
settings:
  base:
    FANCONTROL_APP_ID: com.example.dynamicnotch.DynamicNotch
    FANCONTROL_HELPER_ID: com.example.dynamicnotch.DynamicNotch.fanfi
    FANCONTROL_HELPER_INFO_PLIST: "$(SRCROOT)/../../Support/Helper-Info.plist"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode 26 ignores ENABLE_HARDENED_RUNTIME when signing ad-hoc ("-"): it never passes
    # `-o runtime`, so the signature lacks flag 0x10000. Pass it explicitly. With a real
    # identity Xcode adds `-o runtime` itself; the duplicate is harmless (codesign ORs the flags).
    OTHER_CODE_SIGN_FLAGS: "$(inherited) --options=runtime"
    # Debug builds otherwise split the app into a stub + FanControlSmoke.debug.dylib (SwiftUI
    # previews). With ad-hoc signing + Hardened Runtime, library validation refuses to load that
    # dylib ("mapping process and mapped file (non-platform) have different Team IDs": ad-hoc code
    # has no Team ID), so the Debug app would not launch. Manual-install mode needs a launchable
    # ad-hoc build (README「手動インストールモードでのテスト」).
    ENABLE_DEBUG_DYLIB: NO
targets:
  FanControlHelper:
    type: tool
    platform: macOS
    sources:
      - path: ../../Sources/FanControlHelper
    dependencies:
      - package: FanControl
        product: FanControlCore
      - package: FanControl
        product: FanControlSMC
      - package: FanControl
        product: FanControlXPC
    settings:
      base:
        PRODUCT_NAME: FanControlHelper
        # Code-signing identifier; must equal FanControlHelperIdentifier in the embedded Info.plist.
        PRODUCT_BUNDLE_IDENTIFIER: $(FANCONTROL_HELPER_ID)
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: NO
        INFOPLIST_FILE: ""
        OTHER_LDFLAGS: "$(inherited) -sectcreate __TEXT __info_plist $(FANCONTROL_HELPER_INFO_PLIST)"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  FanControlSmoke:
    type: application
    platform: macOS
    sources:
      - path: Sources
    postBuildScripts:
      # Copies the FanControl* identifiers from Helper-Info.plist into the app's Info.plist and
      # writes Contents/Library/LaunchDaemons/<FanControlMachServiceName>.plist (SMAppService).
      # Runs before code signing. Needs ENABLE_USER_SCRIPT_SANDBOXING = NO (the output name
      # depends on the plist's contents).
      - name: Embed FanControl identifiers
        script: |
          "${SRCROOT}/../../Support/embed-helper-config.sh" "${FANCONTROL_HELPER_INFO_PLIST}"
        # The processed Info.plist is listed so the script runs after ProcessInfoPlistFile;
        # otherwise the two can race and the generated plist overwrites the keys.
        inputFiles:
          - $(FANCONTROL_HELPER_INFO_PLIST)
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - target: FanControlHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - package: FanControl
        product: FanControlCore
      - package: FanControl
        product: FanControlKit
    settings:
      base:
        PRODUCT_NAME: FanControlSmoke
        # Must equal FanControlClientBundleIdentifier in Helper-Info.plist, otherwise the helper
        # rejects the client (embed-helper-config.sh fails the build on a mismatch).
        PRODUCT_BUNDLE_IDENTIFIER: $(FANCONTROL_APP_ID)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: FanControlSmoke
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ""
